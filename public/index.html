<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Agenda Estudiantil</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="ls-pagina">
  <div class="ls-auth-contenedor">
    <form class="ls-auth" id="form-login" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="ls-sub">Entra a tu agenda estudiantil</p>
      <div class="ls-campo">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="ls-campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <p class="ls-mensaje" id="mensaje" role="alert"></p>
      <button class="ls-btn" type="submit" id="btn">Entrar</button>
      <p class="ls-auth-pie">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    (function () {
      if (Sesion.hayToken()) { window.location.href = 'dashboard.html'; return; }

      var form = document.getElementById('form-login');
      var msg = document.getElementById('mensaje');
      var btn = document.getElementById('btn');

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        msg.textContent = ''; msg.className = 'ls-mensaje';
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) {
          msg.textContent = 'Escribe tu correo y tu contraseña.';
          msg.className = 'ls-mensaje ls-error';
          return;
        }
        btn.disabled = true;
        try {
          var r = await apiFetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ correo: email, contrasena: password })
          });
          Sesion.guardar(r.token, r.usuario);
          window.location.href = 'dashboard.html';
        } catch (e) {
          msg.textContent = e.message;
          msg.className = 'ls-mensaje ls-error';
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
