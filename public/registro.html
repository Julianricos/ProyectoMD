<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Agenda Estudiantil</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="ls-pagina">
  <div class="ls-auth-contenedor">
    <form class="ls-auth" id="form-registro" novalidate>
      <h1>Crear cuenta</h1>
      <p class="ls-sub">Empieza a organizar tus tareas</p>
      <div class="ls-campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" autocomplete="name" required>
      </div>
      <div class="ls-campo">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" autocomplete="family-name" required>
      </div>
      <div class="ls-campo">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="ls-campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="new-password" required>
      </div>
      <p class="ls-mensaje" id="mensaje" role="alert"></p>
      <button class="ls-btn" type="submit" id="btn">Registrarme</button>
      <p class="ls-auth-pie">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var form = document.getElementById('form-registro');
      var msg = document.getElementById('mensaje');
      var btn = document.getElementById('btn');

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        msg.textContent = ''; msg.className = 'ls-mensaje';
        var datos = {
          nombre: document.getElementById('nombre').value.trim(),
          apellido: document.getElementById('apellido').value.trim(),
          correo: document.getElementById('email').value.trim(),
          contrasena: document.getElementById('password').value
        };
        if (!datos.nombre || !datos.apellido || !datos.correo || !datos.contrasena) {
          msg.textContent = 'Completa todos los campos.';
          msg.className = 'ls-mensaje ls-error';
          return;
        }
        btn.disabled = true;
        try {
          await apiFetch('/api/auth/registro', { method: 'POST', body: JSON.stringify(datos) });
          msg.textContent = 'Cuenta creada. Redirigiendo al inicio de sesión...';
          msg.className = 'ls-mensaje ls-ok';
          setTimeout(function () { window.location.href = 'index.html'; }, 1200);
        } catch (e) {
          msg.textContent = e.message;
          msg.className = 'ls-mensaje ls-error';
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
